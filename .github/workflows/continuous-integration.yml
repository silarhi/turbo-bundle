name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - '*.x'
            - 'main'
        tags:
            - 'v*.*.*'

jobs:
    matrix:
        name: Generate job matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Gather CI configuration
              id: matrix
              uses: laminas/laminas-ci-matrix-action@v1

    qa:
        name: QA Checks
        needs: [matrix]
        runs-on: ${{ matrix.operatingSystem }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
        steps:
            - name: ${{ matrix.name }}
              uses: laminas/laminas-continuous-integration-action@v1
              with:
                  job: ${{ matrix.job }}
            - name: Upload coverage
              if: ${{ !cancelled() && startsWith(matrix.name, 'PHPUnit [') && endsWith(matrix.name, ', latest]') }}
              uses: actions/upload-artifact@v7
              with:
                  name: clover-${{ fromJSON(matrix.job).php }}
                  path: coverage/clover.xml
                  if-no-files-found: ignore
                  retention-days: 30

    lint:
        name: Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'yarn'
                  cache-dependency-path: 'assets/yarn.lock'
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Biome
              run: yarn lint
            - name: Typecheck
              run: yarn typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'yarn'
                  cache-dependency-path: 'assets/yarn.lock'
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Test
              run: yarn test

    build:
        name: Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'yarn'
                  cache-dependency-path: 'assets/yarn.lock'
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Build
              run: yarn build

    coverage:
        name: Coverage
        needs: [qa]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: write
            pull-requests: write
        uses: silarhi/.github/.github/workflows/coverage-report.yml@main

    ci-passed:
        name: CI passed
        needs: [matrix, qa, lint, test, build]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
