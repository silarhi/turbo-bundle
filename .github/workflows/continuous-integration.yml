name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - '*.x'
            - 'main'
        tags:
            - 'v*.*.*'

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    matrix:
        name: Generate job matrix
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Gather CI configuration
              id: matrix
              uses: laminas/laminas-ci-matrix-action@v1

    qa:
        name: QA Checks
        needs: [matrix]
        runs-on: ${{ matrix.operatingSystem }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
        steps:
            - name: ${{ matrix.name }}
              uses: laminas/laminas-continuous-integration-action@v1
              with:
                  job: ${{ matrix.job }}
            - name: Upload coverage
              if: ${{ !cancelled() && startsWith(matrix.name, 'PHPUnit [') && endsWith(matrix.name, ', latest]') }}
              uses: actions/upload-artifact@v7
              with:
                  name: clover-${{ fromJSON(matrix.job).php }}
                  path: coverage/clover.xml
                  if-no-files-found: ignore
                  retention-days: 30

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Biome
              run: pnpm lint
            - name: Typecheck
              run: pnpm typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test
              run: pnpm test:coverage
            - name: Upload coverage
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: js-coverage
                  path: assets/coverage/clover.xml
                  if-no-files-found: ignore
                  retention-days: 30

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: assets
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm build

    e2e:
        name: E2E (Turbo ${{ matrix.turbo }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    # the locked version
                    - turbo: 8
                    # the lowest version of the peer dependency range
                    - turbo: 7.2.0
                      packages: '@hotwired/turbo@7.2.0'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
            - name: Install Composer dependencies
              run: composer update --no-interaction --no-progress
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: 'assets/package.json'
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
                  cache-dependency-path: 'assets/pnpm-lock.yaml'
            - name: Install dependencies
              working-directory: assets
              run: pnpm install --frozen-lockfile
            - name: Install Turbo ${{ matrix.turbo }}
              if: ${{ matrix.packages }}
              working-directory: assets
              run: pnpm add --save-dev ${{ matrix.packages }}
            - name: Install Chromium
              working-directory: assets
              run: pnpm exec playwright install --with-deps chromium
            - name: Playwright
              working-directory: assets
              run: pnpm e2e
            - name: Upload traces
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-traces-turbo-${{ matrix.turbo }}
                  path: assets/test-results
                  retention-days: 7

    coverage:
        name: Coverage
        needs: [qa, test]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: write
            pull-requests: write
        uses: silarhi/.github/.github/workflows/coverage-report.yml@main

    ci-passed:
        name: CI passed
        needs: [matrix, qa, lint, test, build, e2e]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
